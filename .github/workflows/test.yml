name: Test

# Runs the full per-port CI gate set: dotnet test (per-framework, serial),
# signature regen, drift against the Python reference, and the no-cheat
# audit. Mirrors `bash scripts/run-ci.sh` so there's no drift between local
# and CI.
#
# Concurrency note: the SignalWire.Tests assembly multi-targets net8.0 +
# net9.0 + net10.0 and the shared mock_signalwire / mock_relay servers are
# single-tenant. run-ci.sh runs `dotnet test --framework <fw>` SERIALLY,
# one framework at a time, to keep the mock journal deterministic.
#
# Test runner uses the same docker SDK image as locally
# (mcr.microsoft.com/dotnet/sdk:10.0) so the two paths produce identical
# build/test output. setup-dotnet provides the host-side dotnet that
# enumerate_signatures.py shells out to for the SIGNATURES gate.

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signalwire-dotnet
        uses: actions/checkout@v6
        with:
          path: signalwire-dotnet

      - name: Checkout porting-sdk (mock_relay + mock_signalwire test harnesses)
        uses: actions/checkout@v6
        with:
          repository: signalwire/porting-sdk
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      # The EMISSION gate compares this port's to_dict() output against the
      # signalwire-python oracle (FunctionResult), which pulls fastapi via
      # signalwire/__init__. Check it out so the EMISSION gate has its reference.
      - name: Checkout signalwire-python (EMISSION oracle)
        uses: actions/checkout@v6
        with:
          repository: signalwire/signalwire-python
          path: signalwire-python
          ref: main

      - name: Set up .NET SDKs (net8.0 / net9.0 / net10.0)
        # Host-side dotnet is consumed by scripts/enumerate_signatures.py
        # for the SIGNATURES gate. The TEST gate uses docker (see run-ci.sh).
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set up Python (porting-sdk audit scripts)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      # EMISSION needs `import signalwire` (the oracle). Install from the
      # adjacent checkout only if not already importable.
      - name: Install signalwire-python (EMISSION oracle) if not importable
        run: |
          if python -c "import signalwire.core.function_result" 2>/dev/null; then
            echo "signalwire-python already importable; skipping install"
          else
            pip install ./signalwire-python
          fi

      # TEMP DIAGNOSTIC: the TEST gate fails CS0234 ('SignalWire.Core.Agent does not
      # exist') for net8/9/10 in CI only — it passes 1800 tests in every local config.
      # This dumps the exact state so the runner tells us the mechanism instead of
      # guessing. Remove once the root cause is fixed.
      - name: DIAGNOSE dotnet CS0234
        working-directory: signalwire-dotnet
        continue-on-error: true
        run: |
          echo "===== SDKs ====="; dotnet --list-sdks
          echo "===== RUNTIMES ====="; dotnet --list-runtimes
          echo "===== which dotnet ====="; command -v dotnet; dotnet --version
          echo "===== does the SDK build net8.0 STANDALONE? (isolate SDK from tests) ====="
          dotnet build src/SignalWire/SignalWire.csproj -f net8.0 -c Debug --nologo 2>&1 | tail -30
          echo "===== does the SDK DLL contain Core.Agent types? ====="
          find src/SignalWire/bin -name 'SignalWire.dll' | while read d; do
            echo "-- $d --"; dotnet-ildasm "$d" 2>/dev/null | grep -i 'Core.Agent' | head -3 || \
            (command -v monodis >/dev/null && monodis "$d" 2>/dev/null | grep -i 'ToolRegistry' | head) || \
            echo "  (no ildasm; checking types via a tiny probe below)"
          done
          echo "===== build the TEST project net8.0 with FULL output ====="
          dotnet build tests/SignalWire.Tests.csproj -f net8.0 -c Debug --nologo -v n 2>&1 | grep -iE 'error|Agent|AspNetCore|FrameworkReference|-> ' | head -40

      - name: Run CI gate script (TEST -> SIGNATURES -> DRIFT -> NO-CHEAT)
        working-directory: signalwire-dotnet
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
        run: bash scripts/run-ci.sh
