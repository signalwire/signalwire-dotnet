name: Surface audit

# Layer B symbol-level surface parity. Regenerates port_surface.json from
# C# source via the regex-based scripts/enumerate_surface.py, then diffs
# it against porting-sdk/python_surface.json. Any drift not excused by
# PORT_OMISSIONS.md or PORT_ADDITIONS.md fails the job.
#
# The enumerator is pure Python (regex over src/SignalWire/**/*.cs) so
# we don't need a .NET toolchain for this workflow.

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly at 06:00 UTC — keeps us in sync with porting-sdk updates that
    # follow upstream signalwire-python additions.
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  surface-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signalwire-dotnet
        uses: actions/checkout@v7
        with:
          path: signalwire-dotnet

      - name: Checkout porting-sdk (contains python_surface.json)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # Coordinated-pass pin: 'main' normally; set the PORTING_SDK_REF repo variable
          # to a wave branch to test a coordinated porting-sdk change, declared on the PR
          # (see porting-sdk/COORDINATED_PASS.md). No revert commit.
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # Install the porting-sdk gate scripts' declared dependencies. NOT optional: the
      # enumerator reaches the reference oracle through generate_rest.py, which needs
      # PyYAML, and a bare `except Exception: return None` turned its absence into an EMPTY
      # oracle — 266 oracle-gated members silently failed to emit and the diff reported
      # "311 Python symbol(s) missing from port", blaming a port that was correct. A dev box
      # has PyYAML, so the failure is CI-only by construction. One manifest, shared by all
      # ten repos; check_script_deps.py fails if a script imports something it omits.
      - name: Install porting-sdk script dependencies
        run: python3 -m pip install --quiet -r ${{ github.workspace }}/porting-sdk/scripts/requirements.txt


      # The enumerator READS the oracle (python_surface.json) to oracle-gate its
      # @dataclass / class-B2 field emission, and it resolves porting-sdk itself via
      # generate_rest.resolve_porting_sdk(): $PORTING_SDK first, else a walk up the
      # parents looking for a SIBLING `porting-sdk`. In CI porting-sdk is checked out
      # INSIDE the port repo ($GITHUB_WORKSPACE/porting-sdk), so the sibling walk
      # fails — and the resolver's failure is SILENT: the oracle loads EMPTY and the
      # gated fields simply do not emit. Locally the sibling layout resolves, so the
      # same commit passes on a dev box and reds in CI with a large phantom
      # missing-symbol count (2026-07-26: 311 missing in CI, exit 0 locally; the
      # md5 of port_surface.json was the ONLY differing diff input).
      # Setting PORTING_SDK explicitly removes the guesswork.
      - name: Enumerate .NET public API surface
        working-directory: signalwire-dotnet
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
        run: |
          python3 scripts/enumerate_surface.py
          # Fail LOUD if the oracle did not resolve. Without this the enumerator's
          # silent-empty fallback produces a valid-looking snapshot that is missing
          # every oracle-gated field, and the error surfaces later as a phantom
          # missing-symbol count in the diff — pointing at the port instead of at
          # the resolution failure that actually caused it.
          python3 -c "import json,sys;d=json.load(open('port_surface.json'));c=d['modules'].get('signalwire.core.agent_base',{}).get('classes',{});ok=any('agent_id' in v for v in c.values());print('oracle-gated B2 fields present:',ok);sys.exit(0 if ok else 1)"

      # Record WHICH porting-sdk oracle this job resolved, and fingerprint every diff
      # input. Without this a symbol-count red is unattributable: it looks identical
      # whether the job pulled the coordinated pin, main, or a stale cache. (2026-07-26:
      # a 311-symbol red here reproduced as exit 0 locally against the pin, the committed
      # port_surface.json, and a fresh regen — every input verified equal — so the log
      # itself has to say what it held.)
      - name: Record reference oracle provenance
        working-directory: signalwire-dotnet
        run: |
          echo "PORTING_SDK_REF variable = '${{ vars.PORTING_SDK_REF }}'"
          git -C ${{ github.workspace }}/porting-sdk rev-parse HEAD
          git -C ${{ github.workspace }}/porting-sdk log -1 --format='%h %cI %s'
          md5sum ${{ github.workspace }}/porting-sdk/python_surface.json \
                 port_surface.json PORT_OMISSIONS.md PORT_ADDITIONS.md
          python3 -c "import json;d=json.load(open('${{ github.workspace }}/porting-sdk/python_surface.json'));print('oracle generated_from:',d.get('generated_from'));c=d['modules'].get('signalwire.core.agent_base',{}).get('classes',{});print('reference AgentBase has agent_id:', any('agent_id' in v for v in c.values()))"
          python3 -c "import json;d=json.load(open('port_surface.json'));c=d['modules'].get('signalwire.core.agent_base',{}).get('classes',{});print('PORT AgentBase has agent_id:', any('agent_id' in v for v in c.values()))"

      - name: Diff against Python reference
        working-directory: signalwire-dotnet
        run: |
          python3 ${{ github.workspace }}/porting-sdk/scripts/diff_port_surface.py \
              --reference ${{ github.workspace }}/porting-sdk/python_surface.json \
              --port-surface port_surface.json \
              --omissions PORT_OMISSIONS.md \
              --additions PORT_ADDITIONS.md
